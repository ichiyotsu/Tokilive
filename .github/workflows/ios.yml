name: iOS unsigned archive

on:
  workflow_dispatch:
  pull_request:
  push:

jobs:
  archive:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode
        run: xcodebuild -version
      - name: Archive without signing
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/Tokilive.xcodeproj \
            -scheme Tokilive \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Tokilive.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          APP=$(find "$RUNNER_TEMP/Tokilive.xcarchive/Products/Applications" -name '*.app' -maxdepth 1 | head -1)
          test -n "$APP"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          ditto -c -k --keepParent Payload tokilive-1.4.0-ios-unsigned.ipa
          rm -rf Payload
          unzip -q tokilive-1.4.0-ios-unsigned.ipa
          test -f Payload/Tokilive.app/Tokilive
          file Payload/Tokilive.app/Tokilive | grep -q 'Mach-O'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Payload/Tokilive.app/Info.plist | grep -qx '1.4.0'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Payload/Tokilive.app/Info.plist | grep -qx '5'
          ls -lh Payload/Tokilive.app/Tokilive tokilive-1.4.0-ios-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: tokilive-1.4.0-ios-unsigned
          path: tokilive-1.4.0-ios-unsigned.ipa
          if-no-files-found: error
